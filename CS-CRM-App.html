  let accounts = [];
  let currentFilter = 'All';
  let searchQuery = '';

  // ---------- Persistence ----------

  }

  // ARR and Next Renewal Date come from "Media Customer CS List 2025-09-30" (Summary tab).

  // planning. Nexstar and Paramount are not in that list at all (likely too new / not yet signed)
  // so their ARR/renewal stay as explicit placeholders. Lifecycle stage and health score are
  // directional manual assessments. Unresolved ticket counts and usage-drop flags now come from

  function seedAccounts() {
    const meta = (name) => ACCOUNT_SYNC_META[name] || { unresolvedTickets: 0, usageDrop: false };

  function loadAccounts() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      console.error('Failed to load accounts from localStorage', e);
    }
    const seeded = seedAccounts();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
    } catch (e) {
      console.error('Failed to write seed accounts to localStorage', e);
    }
    return seeded;
  }

  function saveAccounts() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
    } catch (e) {
      console.error('Failed to save accounts to localStorage', e);
    }
  }

  // Per-viewer "Today's Agenda" / "Action Items" notes for This Week at a Glance meetings, keyed by
  // meeting id. Lives only in this browser's localStorage - the sync never reads or writes this object,
  // exactly like touchpoints and account strategy.
  const WEEKLY_NOTES_KEY = 'csCrmWeeklyNotes';
  let weeklyNotes = {};

  function loadWeeklyNotes() {
    try {
      const raw = localStorage.getItem(WEEKLY_NOTES_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      console.error('Failed to load weekly notes from localStorage', e);
    }
    return {};

  function saveWeeklyNotes() {
    try {
      localStorage.setItem(WEEKLY_NOTES_KEY, JSON.stringify(weeklyNotes));
    } catch (e) {
      console.error('Failed to save weekly notes to localStorage', e);
    }
  }

  function updateWeeklyNote(meetingId, field, value) {
    if (!weeklyNotes[meetingId]) weeklyNotes[meetingId] = { agenda: '', actionItems: '' };
    weeklyNotes[meetingId][field] = value;

  // ---------- Sync latest data ----------
  // Merges the four sync-managed structures (MARKET_USAGE_DATA, MARKET_CALL_DATA, ACCOUNT_SYNC_META,
  // MARKET_TICKETS_DATA) into the accounts already saved in this browser's localStorage. Never touches
  // touchpoints, accountStrategy, or the manually-typed per-market fields (mostUsedModule,
  // leastUsedModule, aeUsage, pCodeQuarters, recentEmail, marketTickets) - those are this user's own
  // notes. WEEKLY_MEETINGS_DATA/WEEKLY_GLANCE_MONDAY are NOT part of this merge - they render directly
  // from the constants above on every page load instead (see renderGlance()).
  function syncLatestData() {
    if (!confirm('Pull the latest synced usage data, call notes, ticket counts, and ticket-market mapping into your accounts?\n\nThis will NOT touch your touchpoints, account strategy, or manually-typed market notes.')) return;
    accounts.forEach(a => {
      const meta = ACCOUNT_SYNC_META[a.companyName];
      if (meta) {
        a.unresolvedTickets = meta.unresolvedTickets;
        a.usageDrop = meta.usageDrop;
      }
      const usage = MARKET_USAGE_DATA[a.companyName] || [];
      const callData = MARKET_CALL_DATA[a.companyName] || {};
      const ticketData = MARKET_TICKETS_DATA[a.companyName] || {};
      if (!a.markets) a.markets = [];
      usage.forEach(u => {
        let m = a.markets.find(x => x.name === u.name);
        if (!m) {
          m = { name: u.name, daysActive: 0, dataLoads: 0, mostUsedModule: '', leastUsedModule: '', aeUsage: '', pCodeQuarters: '', recentEmail: '', recentCall: '', relatedTickets: '', marketTickets: '' };
          a.markets.push(m);
        }
        m.daysActive = u.daysActive;
        m.dataLoads = u.dataLoads;
        if (m.marketTickets === undefined) m.marketTickets = '';
        if (callData[u.name] !== undefined) m.recentCall = callData[u.name];
        if (ticketData[u.name] !== undefined) m.relatedTickets = ticketData[u.name];
      });
    });
    saveAccounts();
    renderAll();
    alert('Synced latest usage data, call notes, ticket counts, and ticket-market mapping into your accounts.');
  }

  // ---------- Helpers ----------
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function formatCurrency(n) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(Number(n) || 0);
  }

  function tierBadge(tier) {
    const map = { 'Enterprise': 'bg-indigo-100 text-indigo-700', 'Mid-Market': 'bg-blue-100 text-blue-700', 'SMB': 'bg-slate-200 text-slate-700' };
    return `<span class="px-2 py-1 rounded-full text-xs font-semibold ${map[tier] || 'bg-slate-100 text-slate-600'}">${escapeHtml(tier)}</span>`;
  }

  function healthBadge(h) {
    const map = { 'Green': 'bg-green-100 text-green-700', 'Yellow': 'bg-yellow-100 text-yellow-700', 'Red': 'bg-red-100 text-red-700' };
    return `<span class="px-2 py-1 rounded-full text-xs font-semibold ${map[h] || 'bg-slate-100 text-slate-600'}">${escapeHtml(h)}</span>`;
  }

    document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
    document.getElementById('view-' + view).classList.remove('hidden');
    document.querySelectorAll('.nav-link').forEach(el => {
      if (el.dataset.view === view) {
        el.classList.add('bg-indigo-50', 'text-indigo-700');
        el.classList.remove('text-slate-600');
      } else {
        el.classList.remove('bg-indigo-50', 'text-indigo-700');
        el.classList.add('text-slate-600');
      }
    });
    const titles = { dashboard: 'Dashboard', accounts: 'Accounts Directory', kanban: 'Lifecycle Board', market: 'Market Summary', glance: 'This Week at a Glance' };
    document.getElementById('pageTitle').textContent = titles[view];
  }

  // ---------- Dashboard ----------
  function computeMetrics() {
    const totalAccounts = accounts.length;
    const arrAtRisk = accounts.filter(a => a.usageDrop || a.healthScore === 'Red').reduce((s, a) => s + Number(a.arr), 0);
    const totalTickets = accounts.reduce((s, a) => s + Number(a.unresolvedTickets), 0);
    const greenCount = accounts.filter(a => a.healthScore === 'Green').length;
    const healthPct = totalAccounts ? Math.round((greenCount / totalAccounts) * 100) : 0;
    return { totalAccounts, arrAtRisk, totalTickets, healthPct };
  }

  function healthLabel(pct) {
    if (pct >= 70) return { label: 'Healthy', color: 'text-green-600' };
    if (pct >= 40) return { label: 'At Risk', color: 'text-yellow-600' };
    return { label: 'Critical', color: 'text-red-600' };
  }

  function metricCard(label, value, colorClass) {
    return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
      <p class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2">${label}</p>
      <p class="text-2xl font-bold ${colorClass}">${value}</p>
    </div>`;
  }

  function renderDashboard() {
    const m = computeMetrics();
    const hl = healthLabel(m.healthPct);

    const tierRows = TIERS.map(t => {
      const list = accounts.filter(a => a.marketTier === t);
      const arr = list.reduce((s, a) => s + Number(a.arr), 0);
      const tickets = list.reduce((s, a) => s + Number(a.unresolvedTickets), 0);
      return `<tr class="border-b border-slate-100 last:border-0">
        <td class="py-3 px-4 font-medium text-slate-800">${t}</td>
        <td class="py-3 px-4 text-slate-600">${list.length}</td>
        <td class="py-3 px-4 text-slate-600">${formatCurrency(arr)}</td>
        <td class="py-3 px-4 text-slate-600">${tickets}</td>

    }).join('');

    const dropAccounts = accounts.filter(a => a.usageDrop);
    const alertRows = dropAccounts.length ? dropAccounts.map(a => `
      <div class="flex items-center justify-between py-3 px-4 border-b border-slate-100 last:border-0">
        <div>
          <button onclick="openProfileModal('${a.id}')" class="font-medium text-indigo-600 hover:underline">${escapeHtml(a.companyName)}</button>
          <span class="ml-2 text-xs text-slate-500">${escapeHtml(a.marketTier)} &middot; ${formatCurrency(a.arr)} ARR</span>

        <span class="inline-flex items-center gap-1 text-xs font-semibold text-red-700 bg-red-100 px-2 py-1 rounded-full">&#9888; Usage Drop</span>
      </div>`).join('') : `<div class="py-6 px-4 text-sm text-slate-400 text-center">No usage-drop alerts. All clear.</div>`;

    document.getElementById('dashboardContent').innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        ${metricCard('Total Managed Accounts', m.totalAccounts, 'text-slate-900')}

        ${metricCard('Total Unresolved Tickets', m.totalTickets, 'text-amber-600')}
        ${metricCard('Overall Portfolio Health', hl.label + ' (' + m.healthPct + '%)', hl.color)}

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
          <div class="px-5 py-4 border-b border-slate-100"><h2 class="font-semibold text-slate-900">Market Tier Breakdown</h2></div>
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs text-slate-500 uppercase tracking-wide">
              <th class="py-2 px-4">Tier</th><th class="py-2 px-4">Accounts</th><th class="py-2 px-4">ARR</th><th class="py-2 px-4">Tickets</th>

            <tbody>${tierRows}</tbody>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm">

  // ---------- Accounts Directory ----------
  function getFilteredAccounts() {
    return accounts.filter(a => {
      const matchesTier = currentFilter === 'All' || a.marketTier === currentFilter;
      const q = searchQuery.trim().toLowerCase();
      const matchesSearch = !q || a.companyName.toLowerCase().includes(q) || a.marketTier.toLowerCase().includes(q);
      return matchesTier && matchesSearch;

    document.querySelectorAll('.filter-btn').forEach(btn => {

      btn.classList.toggle('bg-indigo-600', active);
      btn.classList.toggle('text-white', active);

  function toggleUsageDrop(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    a.usageDrop = !a.usageDrop;
    saveAccounts();
    renderAll();
  }

  function deleteAccount(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    if (!confirm(`Delete ${a.companyName}? This cannot be undone.`)) return;
    accounts = accounts.filter(x => x.id !== id);
    saveAccounts();
    if (profileAccountId === id) closeModal();
    renderAll();

  function csvEscape(val) {
    const s = String(val === undefined || val === null ? '' : val);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCSV() {
    const headers = ['Company Name', 'Market Tier', 'ARR', 'Lifecycle Stage', 'Health Score', 'Unresolved Tickets', 'Usage Drop', 'Next Renewal Date'];
    const rows = accounts.map(a => [a.companyName, a.marketTier, a.arr, a.lifecycleStage, a.healthScore, a.unresolvedTickets, a.usageDrop ? 'Yes' : 'No', a.nextRenewalDate]);
    const csvContent = [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', `cs-accounts-${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

    else if (flagTickets) warningText = a.unresolvedTickets + ' Open Tickets';

    return `<div class="bg-white rounded-lg border border-slate-200 shadow-sm p-3">
      <div class="flex items-start justify-between mb-1 gap-2">

  function renderMarketSummary() {

      const yellowCount = list.filter(a => a.healthScore === 'Yellow').length;
      const redCount = list.filter(a => a.healthScore === 'Red').length;

      const rows = list.length ? list.map(a => marketAccountRow(a)).join('')
        : `<p class="text-sm text-slate-400 px-5 py-6 text-center">No accounts in this tier.</p>`;

      return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm mb-6">

  function marketAccountRow(a) {

  // ---------- This Week at a Glance ----------
  function companyAccountId(companyName) {
    const a = accounts.find(x => x.companyName === companyName);

  function renderGlance() {
    const container = document.getElementById('glanceContent');
    if (!container) return;
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    const byDay = {};
    days.forEach(d => byDay[d] = []);
    (WEEKLY_MEETINGS_DATA || []).forEach(m => { if (byDay[m.day]) byDay[m.day].push(m); });
    days.forEach(d => byDay[d].sort((a, b) => (a.time || '').localeCompare(b.time || '')));

    const weekLabel = WEEKLY_GLANCE_MONDAY ? `Week of ${WEEKLY_GLANCE_MONDAY}` : 'No week set yet';
    const totalCount = (WEEKLY_MEETINGS_DATA || []).length;

    container.innerHTML = `
      <div class="mb-5 flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 class="text-lg font-semibold text-slate-900">${escapeHtml(weekLabel)}</h2>
          <p class="text-xs text-slate-400">${totalCount} real customer meeting${totalCount === 1 ? '' : 's'} this week, pulled from Outlook. Today's Agenda / Action Items save locally in your browser only.</p>
        </div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
        ${days.map(d => `

  function submitAccountForm(event) {
    event.preventDefault();
    const form = event.target;
    document.querySelectorAll('.field-error').forEach(el => el.textContent = '');

    const raw = {
      companyName: form.companyName.value.trim(),
      marketTier: form.marketTier.value,
      arr: form.arr.value,
      lifecycleStage: form.lifecycleStage.value,
      healthScore: form.healthScore.value,
      unresolvedTickets: form.unresolvedTickets.value,
      nextRenewalDate: form.nextRenewalDate.value,
      usageDrop: form.usageDrop.checked
    };

    let valid = true;
    function setError(field, msg) {
      valid = false;
      const el = form.querySelector(`.field-error[data-field="${field}"]`);
      if (el) el.textContent = msg;
    }

    if (!raw.companyName) setError('companyName', 'Company name is required.');
    if (!TIERS.includes(raw.marketTier)) setError('marketTier', 'Select a market tier.');
    if (raw.arr === '' || isNaN(Number(raw.arr)) || Number(raw.arr) < 0) setError('arr', 'Enter a valid non-negative ARR.');
    if (!STAGES.includes(raw.lifecycleStage)) setError('lifecycleStage', 'Select a lifecycle stage.');
    if (!HEALTH_SCORES.includes(raw.healthScore)) setError('healthScore', 'Select a health score.');
    if (raw.unresolvedTickets === '' || isNaN(Number(raw.unresolvedTickets)) || Number(raw.unresolvedTickets) < 0 || !Number.isInteger(Number(raw.unresolvedTickets))) setError('unresolvedTickets', 'Enter a valid non-negative whole number.');
    if (!raw.nextRenewalDate) setError('nextRenewalDate', 'Select a renewal date.');

    if (!valid) return;

    if (editingAccountId) {
      const a = accounts.find(x => x.id === editingAccountId);
      Object.assign(a, {
        companyName: raw.companyName,
        marketTier: raw.marketTier,
        arr: Number(raw.arr),
        lifecycleStage: raw.lifecycleStage,
        healthScore: raw.healthScore,
        unresolvedTickets: Number(raw.unresolvedTickets),
        nextRenewalDate: raw.nextRenewalDate,
        usageDrop: raw.usageDrop
      });
    } else {
      accounts.push({
        id: uuid(),
        companyName: raw.companyName,
        marketTier: raw.marketTier,
        arr: Number(raw.arr),
        lifecycleStage: raw.lifecycleStage,
        healthScore: raw.healthScore,
        unresolvedTickets: Number(raw.unresolvedTickets),
        nextRenewalDate: raw.nextRenewalDate,
        usageDrop: raw.usageDrop,
        accountStrategy: '',
        touchpoints: [],
        markets: []
      });
    }

    saveAccounts();
    closeModal();
    renderAll();
  }

          </div>
          <div class="flex gap-2 mb-5">
            <input id="touchpointInput" type="text" placeholder="e.g. Discussed usage drop in sync" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" onkeydown="if(event.key==='Enter'){event.preventDefault();logTouchpoint('${a.id}')}">
            <button onclick="logTouchpoint('${a.id}')" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg whitespace-nowrap">Log Touchpoint</button>
          </div>
          <div class="max-h-64 overflow-y-auto scrollbar-thin pr-2">
            ${touchpointsHtml}
          </div>
        </div>
      </div>
    </div>`;
  }

  function changeTicketCount(id, delta) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    a.unresolvedTickets = Math.max(0, Number(a.unresolvedTickets) + delta);
    saveAccounts();
    renderAll();
  }

  function logTouchpoint(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    const input = document.getElementById('touchpointInput');
    const note = input.value.trim();
    if (!note) return;
    if (!a.touchpoints) a.touchpoints = [];
    a.touchpoints.push({
      note,
      timestamp: new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })
    });
    saveAccounts();
    renderProfileModalContent(id);
  }

  function saveAccountStrategy(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    const input = document.getElementById('strategyInput');
    a.accountStrategy = input.value.trim();
    saveAccounts();
    renderMarketSummary();
  }

  function closeModal() {
    document.getElementById('modalRoot').innerHTML = '';
    editingAccountId = null;
    profileAccountId = null;
    marketsModalAccountId = null;
  }

  // Wipes any locally-saved edits and reloads the sample data baked into this file's
  // seedAccounts(). Use this after the app itself has been updated with new sample data,
  // since a browser's existing localStorage otherwise takes precedence over code changes.
  function resetToSeedData() {
    if (!confirm('This will erase all local edits (touchpoints, strategies, market notes, added/edited accounts) and reload this file\'s built-in sample data. Continue?')) return;
    accounts = seedAccounts();
    saveAccounts();
    closeModal();
    renderAll();
  }

  // ---------- Init ----------
  accounts = loadAccounts();
  weeklyNotes = loadWeeklyNotes();
  renderAll();
  showView('dashboard');
  updateFilterButtons();
  document.getElementById('searchInput').addEventListener('input', handleSearch);
</script>
</body>
</html>
