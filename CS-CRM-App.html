<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Command — Customer Success CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .scrollbar-thin::-webkit-scrollbar { height: 6px; width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .view-section.hidden { display: none; }
</style>
</head>
<body class="bg-slate-100 text-slate-800">

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0">
    <div class="h-16 flex items-center px-6 border-b border-slate-200 gap-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm">CS</div>
      <span class="text-base font-bold text-slate-900">CS Command</span>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <button data-view="dashboard" onclick="showView('dashboard')" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        Dashboard
      </button>
      <button data-view="accounts" onclick="showView('accounts')" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>
        Accounts Directory
      </button>
      <button data-view="kanban" onclick="showView('kanban')" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg>
        Lifecycle Board
      </button>
      <button data-view="market" onclick="showView('market')" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
        Market Summary
      </button>
      <button data-view="glance" onclick="showView('glance')" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        This Week at a Glance
      </button>
    </nav>
    <div class="p-4 border-t border-slate-200 space-y-2">
      <p class="text-xs text-slate-400">Data stored locally in your browser (localStorage). Nothing leaves this device.</p>
      <button onclick="syncLatestData()" class="text-xs font-medium text-indigo-600 hover:underline block">&#8635; Sync latest data</button>
      <p id="lastSyncedLabel" class="text-xs text-slate-400"></p>
      <button onclick="resetToSeedData()" class="text-xs font-medium text-indigo-600 hover:underline block">&#8635; Reset to latest sample data</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10">
      <h1 id="pageTitle" class="text-xl font-semibold text-slate-900">Dashboard</h1>
    </header>

    <div class="p-8">

      <!-- DASHBOARD VIEW -->
      <section id="view-dashboard" class="view-section">
        <div id="dashboardContent"></div>
      </section>

      <!-- ACCOUNTS VIEW -->
      <section id="view-accounts" class="view-section hidden">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-5">
          <div class="relative w-full md:w-96">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="searchInput" type="text" placeholder="Search by company name or market tier..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
          </div>
          <div class="flex items-center gap-2">
            <button onclick="exportCSV()" class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50">Export to CSV</button>
            <button onclick="openAddEditModal()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">+ Add Account</button>
          </div>
        </div>

        <div class="flex items-center gap-2 mb-5">
          <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200" data-tier="All" onclick="setFilter('All')">All</button>
          <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200" data-tier="Enterprise" onclick="setFilter('Enterprise')">Enterprise</button>
          <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200" data-tier="Mid-Market" onclick="setFilter('Mid-Market')">Mid-Market</button>
          <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200" data-tier="SMB" onclick="setFilter('SMB')">SMB</button>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
          <table class="w-full text-sm min-w-[900px]">
            <thead>
              <tr class="text-left text-xs text-slate-500 uppercase tracking-wide border-b border-slate-200">
                <th class="py-3 px-4">Company Name</th>
                <th class="py-3 px-4">Market Tier</th>
                <th class="py-3 px-4">ARR</th>
                <th class="py-3 px-4">Lifecycle Stage</th>
                <th class="py-3 px-4">Health Score</th>
                <th class="py-3 px-4">Unresolved Tickets</th>
                <th class="py-3 px-4">Usage Drop</th>
                <th class="py-3 px-4">Next Renewal</th>
                <th class="py-3 px-4 text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="accountsTableBody"></tbody>
          </table>
        </div>
      </section>

      <!-- KANBAN VIEW -->
      <section id="view-kanban" class="view-section hidden">
        <div id="kanbanContent"></div>
      </section>

      <!-- MARKET SUMMARY VIEW -->
      <section id="view-market" class="view-section hidden">
        <div id="marketContent"></div>
      </section>

      <!-- THIS WEEK AT A GLANCE VIEW -->
      <section id="view-glance" class="view-section hidden">
        <div id="glanceContent"></div>
      </section>

    </div>
  </main>
</div>

<!-- Modal root -->
<div id="modalRoot"></div>

  function escapeHtml(str) {

  }

  // ---------- Dashboard ----------
  function computeMetrics() {
    const totalAccounts = accounts.length;
    const arrAtRisk = accounts.filter(a => a.usageDrop || a.healthScore === 'Red').reduce((s, a) => s + Number(a.arr), 0);
    const totalTickets = accounts.reduce((s, a) => s + Number(a.unresolvedTickets), 0);
    const greenCount = accounts.filter(a => a.healthScore === 'Green').length;
    const healthPct = totalAccounts ? Math.round((greenCount / totalAccounts) * 100) : 0;
    return { totalAccounts, arrAtRisk, totalTickets, healthPct };
  }

  function healthLabel(pct) {
    if (pct >= 70) return { label: 'Healthy', color: 'text-green-600' };
    if (pct >= 40) return { label: 'At Risk', color: 'text-yellow-600' };
    return { label: 'Critical', color: 'text-red-600' };
  }

  function metricCard(label, value, colorClass) {
    return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
      <p class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2">${label}</p>
      <p class="text-2xl font-bold ${colorClass}">${value}</p>
    </div>`;
  }

        ${metricCard('Total Managed Accounts', m.totalAccounts, 'text-slate-900')}
        ${metricCard('ARR At Risk', formatCurrency(m.arrAtRisk), 'text-red-600')}
        ${metricCard('Total Unresolved Tickets', m.totalTickets, 'text-amber-600')}
        ${metricCard('Overall Portfolio Health', hl.label + ' (' + m.healthPct + '%)', hl.color)}
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
          <div class="px-5 py-4 border-b border-slate-100"><h2 class="font-semibold text-slate-900">Market Tier Breakdown</h2></div>

            <thead><tr class="text-left text-xs text-slate-500 uppercase tracking-wide">
              <th class="py-2 px-4">Tier</th><th class="py-2 px-4">Accounts</th><th class="py-2 px-4">ARR</th><th class="py-2 px-4">Tickets</th>

  // ---------- Accounts Directory ----------
  function getFilteredAccounts() {
    return accounts.filter(a => {
      const matchesTier = currentFilter === 'All' || a.marketTier === currentFilter;
      const q = searchQuery.trim().toLowerCase();
      const matchesSearch = !q || a.companyName.toLowerCase().includes(q) || a.marketTier.toLowerCase().includes(q);
      return matchesTier && matchesSearch;
    });
  }

  function renderAccountsTable() {
    const list = getFilteredAccounts();
    const tbody = document.getElementById('accountsTableBody');
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="9" class="py-8 text-center text-slate-400">No accounts match your search/filter.</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(a => `
      <tr class="border-b border-slate-100 hover:bg-slate-50">
        <td class="py-3 px-4"><button onclick="openProfileModal('${a.id}')" class="font-medium text-indigo-600 hover:underline">${escapeHtml(a.companyName)}</button></td>
        <td class="py-3 px-4">${tierBadge(a.marketTier)}</td>
        <td class="py-3 px-4 text-slate-700">${formatCurrency(a.arr)}</td>
        <td class="py-3 px-4 text-slate-700">${escapeHtml(a.lifecycleStage)}</td>
        <td class="py-3 px-4">${healthBadge(a.healthScore)}</td>
        <td class="py-3 px-4 text-slate-700">${a.unresolvedTickets}</td>
        <td class="py-3 px-4">
          <button onclick="toggleUsageDrop('${a.id}')" class="px-2 py-1 rounded-full text-xs font-semibold ${a.usageDrop ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-500'}">${a.usageDrop ? 'Yes' : 'No'}</button>
        </td>
        <td class="py-3 px-4 text-slate-700">${a.nextRenewalDate}</td>
        <td class="py-3 px-4 text-right whitespace-nowrap">
          <button onclick="openAddEditModal('${a.id}')" class="text-slate-500 hover:text-indigo-600 text-sm font-medium mr-3">Edit</button>
          <button onclick="deleteAccount('${a.id}')" class="text-slate-500 hover:text-red-600 text-sm font-medium">Delete</button>
        </td>
      </tr>
    `).join('');
  }

  function setFilter(tier) {
    currentFilter = tier;
    renderAccountsTable();
    updateFilterButtons();
  }

  function updateFilterButtons() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      const active = btn.dataset.tier === currentFilter;
      btn.classList.toggle('bg-indigo-600', active);
      btn.classList.toggle('text-white', active);
      btn.classList.toggle('border-indigo-600', active);
      btn.classList.toggle('bg-white', !active);
      btn.classList.toggle('text-slate-600', !active);
    });
  }

  function handleSearch(e) {
    searchQuery = e.target.value;
    renderAccountsTable();
  }

  function toggleUsageDrop(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    a.usageDrop = !a.usageDrop;
    saveAccounts();
    renderAll();
  }

  function deleteAccount(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    if (!confirm(`Delete ${a.companyName}? This cannot be undone.`)) return;
    accounts = accounts.filter(x => x.id !== id);
    saveAccounts();
    if (profileAccountId === id) closeModal();
    renderAll();
  }

  function csvEscape(val) {
    const s = String(val === undefined || val === null ? '' : val);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCSV() {
    const headers = ['Company Name', 'Market Tier', 'ARR', 'Lifecycle Stage', 'Health Score', 'Unresolved Tickets', 'Usage Drop', 'Next Renewal Date'];
    const rows = accounts.map(a => [a.companyName, a.marketTier, a.arr, a.lifecycleStage, a.healthScore, a.unresolvedTickets, a.usageDrop ? 'Yes' : 'No', a.nextRenewalDate]);
    const csvContent = [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', `cs-accounts-${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  // ---------- Kanban ----------
  function renderKanban() {
    const container = document.getElementById('kanbanContent');
    container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">${STAGES.map(stage => {
      const list = accounts.filter(a => a.lifecycleStage === stage);
      return `<div class="bg-slate-50 rounded-xl border border-slate-200 flex flex-col">
        <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
          <h3 class="font-semibold text-slate-800 text-sm">${stage}</h3>
          <span class="text-xs font-medium text-slate-400 bg-white border border-slate-200 rounded-full px-2 py-0.5">${list.length}</span>
        </div>
        <div class="p-3 space-y-3 overflow-y-auto scrollbar-thin" style="max-height: 65vh;">
          ${list.length ? list.map(a => kanbanCard(a)).join('') : `<p class="text-xs text-slate-400 text-center py-6">No accounts in this stage</p>`}
        </div>
      </div>`;
    }).join('')}</div>`;
  }

  function kanbanCard(a) {
    const flagUsage = a.usageDrop;
    const flagTickets = Number(a.unresolvedTickets) > 3;
    let warningText = '';
    if (flagUsage && flagTickets) warningText = 'Usage Drop &middot; ' + a.unresolvedTickets + ' Open Tickets';
    else if (flagUsage) warningText = 'Usage Drop';
    else if (flagTickets) warningText = a.unresolvedTickets + ' Open Tickets';

    return `<div class="bg-white rounded-lg border border-slate-200 shadow-sm p-3">
      <div class="flex items-start justify-between mb-1 gap-2">
        <button onclick="openProfileModal('${a.id}')" class="font-medium text-sm text-indigo-600 hover:underline text-left">${escapeHtml(a.companyName)}</button>
        ${healthBadge(a.healthScore)}
      </div>
      <div class="text-xs text-slate-500 mb-2 flex items-center gap-1 flex-wrap">${tierBadge(a.marketTier)} <span>${formatCurrency(a.arr)} ARR</span></div>
      ${warningText ? `<div class="text-xs font-semibold text-red-700 bg-red-100 rounded px-2 py-1 mb-2 inline-block">&#9888; ${warningText}</div>` : ''}
      <select onchange="changeStage('${a.id}', this.value)" class="w-full text-xs border border-slate-200 rounded px-2 py-1 bg-slate-50">
        ${STAGES.map(s => `<option value="${s}" ${s === a.lifecycleStage ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
    </div>`;
  }

  function changeStage(id, stage) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    a.lifecycleStage = stage;
    saveAccounts();
    renderAll();
  }

  // ---------- Market Summary ----------

    const container = document.getElementById('marketContent');
    container.innerHTML = TIERS.map(tier => {
      const list = accounts.filter(a => a.marketTier === tier);
      const arr = list.reduce((s, a) => s + Number(a.arr), 0);
      const tickets = list.reduce((s, a) => s + Number(a.unresolvedTickets), 0);
      const greenCount = list.filter(a => a.healthScore === 'Green').length;
      const yellowCount = list.filter(a => a.healthScore === 'Yellow').length;
      const redCount = list.filter(a => a.healthScore === 'Red').length;
      const dropCount = list.filter(a => a.usageDrop).length;

      const rows = list.length ? list.map(a => marketAccountRow(a)).join('')
        : `<p class="text-sm text-slate-400 px-5 py-6 text-center">No accounts in this tier.</p>`;

      return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm mb-6">

            <h2 class="font-semibold text-slate-900">${tier}</h2>
            <p class="text-xs text-slate-400">${list.length} account${list.length === 1 ? '' : 's'} &middot; ${formatCurrency(arr)} ARR &middot; ${tickets} unresolved ticket${tickets === 1 ? '' : 's'}</p>

          <div class="flex items-center gap-2 text-xs font-semibold">
            <span class="px-2 py-1 rounded-full bg-green-100 text-green-700">${greenCount} Green</span>
            <span class="px-2 py-1 rounded-full bg-yellow-100 text-yellow-700">${yellowCount} Yellow</span>
            <span class="px-2 py-1 rounded-full bg-red-100 text-red-700">${redCount} Red</span>

    const warn = a.usageDrop || Number(a.unresolvedTickets) > 3;

    return `<div class="px-5 py-4">

  // ---------- This Week at a Glance ----------
  function companyAccountId(companyName) {
    const a = accounts.find(x => x.companyName === companyName);
    return a ? a.id : null;
  }

  function renderGlance() {
    const container = document.getElementById('glanceContent');
    if (!container) return;
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    const byDay = {};
    days.forEach(d => byDay[d] = []);
    (WEEKLY_MEETINGS_DATA || []).forEach(m => { if (byDay[m.day]) byDay[m.day].push(m); });
    days.forEach(d => byDay[d].sort((a, b) => (a.time || '').localeCompare(b.time || '')));

    const weekLabel = WEEKLY_GLANCE_MONDAY ? `Week of ${WEEKLY_GLANCE_MONDAY}` : 'No week set yet';
    const totalCount = (WEEKLY_MEETINGS_DATA || []).length;

    container.innerHTML = `
      <div class="mb-5 flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 class="text-lg font-semibold text-slate-900">${escapeHtml(weekLabel)}</h2>
          <p class="text-xs text-slate-400">${totalCount} real customer meeting${totalCount === 1 ? '' : 's'} this week, pulled from Outlook. Today's Agenda / Action Items save locally in your browser only.</p>
        </div>
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
        ${days.map(d => `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col">
            <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
              <h3 class="font-semibold text-slate-800 text-sm">${d}</h3>
              <span class="text-xs font-medium text-slate-400 bg-slate-50 border border-slate-200 rounded-full px-2 py-0.5">${byDay[d].length}</span>
            </div>
            <div class="p-3 space-y-3 overflow-y-auto scrollbar-thin" style="max-height: 75vh;">

        `).join('')}
      </div>

                  <th class="py-2 px-3">AE Usage</th>
                  <th class="py-2 px-3">P-Codes Set (Qtrs)</th>
                  <th class="py-2 px-3">Recent Email</th>
                  <th class="py-2 px-3">Recent Call</th>
                  <th class="py-2 px-3">Related Tickets (synced)</th>
                  <th class="py-2 px-3">Ticket Notes (yours)</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>
      </div>
    </div>`;
  }

  function updateMarketField(accountId, marketIndex, field, value) {
    const a = accounts.find(x => x.id === accountId);
    if (!a || !a.markets || !a.markets[marketIndex]) return;
    a.markets[marketIndex][field] = value;
    saveAccounts();
  }

  // ---------- Add / Edit Modal ----------
  function openAddEditModal(id) {
    editingAccountId = id || null;
    const a = id ? accounts.find(x => x.id === id) : null;
    const isEdit = !!a;

    document.getElementById('modalRoot').innerHTML = `
    <div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4" onclick="if(event.target===this) closeModal()">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-slate-900">${isEdit ? 'Edit Account' : 'Add Account'}</h2>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
        </div>
        <form id="accountForm" onsubmit="submitAccountForm(event)" class="px-6 py-5 space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Company Name</label>
            <input type="text" name="companyName" value="${a ? escapeHtml(a.companyName) : ''}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
            <p class="field-error text-red-600 text-xs mt-1" data-field="companyName"></p>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Market Tier</label>
              <select name="marketTier" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <option value="">Select...</option>
                ${TIERS.map(t => `<option value="${t}" ${a && a.marketTier === t ? 'selected' : ''}>${t}</option>`).join('')}
              </select>
              <p class="field-error text-red-600 text-xs mt-1" data-field="marketTier"></p>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">ARR ($)</label>
              <input type="number" name="arr" min="0" step="1" value="${a ? a.arr : ''}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
              <p class="field-error text-red-600 text-xs mt-1" data-field="arr"></p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Lifecycle Stage</label>
              <select name="lifecycleStage" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <option value="">Select...</option>
                ${STAGES.map(s => `<option value="${s}" ${a && a.lifecycleStage === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
              <p class="field-error text-red-600 text-xs mt-1" data-field="lifecycleStage"></p>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Health Score</label>
              <select name="healthScore" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                <option value="">Select...</option>
                ${HEALTH_SCORES.map(h => `<option value="${h}" ${a && a.healthScore === h ? 'selected' : ''}>${h}</option>`).join('')}
              </select>
              <p class="field-error text-red-600 text-xs mt-1" data-field="healthScore"></p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Unresolved Tickets</label>
              <input type="number" name="unresolvedTickets" min="0" step="1" value="${a ? a.unresolvedTickets : 0}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
              <p class="field-error text-red-600 text-xs mt-1" data-field="unresolvedTickets"></p>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">Next Renewal Date</label>
              <input type="date" name="nextRenewalDate" value="${a ? a.nextRenewalDate : ''}" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
              <p class="field-error text-red-600 text-xs mt-1" data-field="nextRenewalDate"></p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" id="usageDropCheckbox" name="usageDrop" ${a && a.usageDrop ? 'checked' : ''} class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
            <label for="usageDropCheckbox" class="text-sm font-medium text-slate-700">Usage Drop Flagged</label>
          </div>
          <div class="flex justify-end gap-3 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
            <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg">${isEdit ? 'Save Changes' : 'Add Account'}</button>
          </div>
        </form>
      </div>
    </div>`;
  }

  function submitAccountForm(event) {
    event.preventDefault();
    const form = event.target;
    document.querySelectorAll('.field-error').forEach(el => el.textContent = '');

    const raw = {
      companyName: form.companyName.value.trim(),
      marketTier: form.marketTier.value,
      arr: form.arr.value,
      lifecycleStage: form.lifecycleStage.value,
      healthScore: form.healthScore.value,
      unresolvedTickets: form.unresolvedTickets.value,
      nextRenewalDate: form.nextRenewalDate.value,
      usageDrop: form.usageDrop.checked
    };

    let valid = true;
    function setError(field, msg) {
      valid = false;
      const el = form.querySelector(`.field-error[data-field="${field}"]`);
      if (el) el.textContent = msg;
    }

    if (!raw.companyName) setError('companyName', 'Company name is required.');
    if (!TIERS.includes(raw.marketTier)) setError('marketTier', 'Select a market tier.');
    if (raw.arr === '' || isNaN(Number(raw.arr)) || Number(raw.arr) < 0) setError('arr', 'Enter a valid non-negative ARR.');
    if (!STAGES.includes(raw.lifecycleStage)) setError('lifecycleStage', 'Select a lifecycle stage.');
    if (!HEALTH_SCORES.includes(raw.healthScore)) setError('healthScore', 'Select a health score.');
    if (raw.unresolvedTickets === '' || isNaN(Number(raw.unresolvedTickets)) || Number(raw.unresolvedTickets) < 0 || !Number.isInteger(Number(raw.unresolvedTickets))) setError('unresolvedTickets', 'Enter a valid non-negative whole number.');
    if (!raw.nextRenewalDate) setError('nextRenewalDate', 'Select a renewal date.');

    if (!valid) return;

    if (editingAccountId) {
      const a = accounts.find(x => x.id === editingAccountId);
      Object.assign(a, {
        companyName: raw.companyName,
        marketTier: raw.marketTier,
        arr: Number(raw.arr),
        lifecycleStage: raw.lifecycleStage,
        healthScore: raw.healthScore,
        unresolvedTickets: Number(raw.unresolvedTickets),
        nextRenewalDate: raw.nextRenewalDate,
        usageDrop: raw.usageDrop
      });
    } else {
      accounts.push({
        id: uuid(),
        companyName: raw.companyName,
        marketTier: raw.marketTier,
        arr: Number(raw.arr),
        lifecycleStage: raw.lifecycleStage,
        healthScore: raw.healthScore,
        unresolvedTickets: Number(raw.unresolvedTickets),
        nextRenewalDate: raw.nextRenewalDate,
        usageDrop: raw.usageDrop,
        accountStrategy: '',
        touchpoints: [],
        markets: []
      });
    }

    saveAccounts();
    closeModal();
    renderAll();
  }

  // ---------- Profile Modal ----------
  function openProfileModal(id) {
    profileAccountId = id;
    renderProfileModalContent(id);
  }

  function renderProfileModalContent(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) { closeModal(); return; }
    const warn = a.usageDrop || Number(a.unresolvedTickets) > 3;

    const touchpointsHtml = (a.touchpoints && a.touchpoints.length)
      ? [...a.touchpoints].reverse().map(t => `
        <div class="border-l-2 border-indigo-200 pl-4 pb-4 relative">
          <div class="absolute -left-[5px] top-1 w-2 h-2 rounded-full bg-indigo-500"></div>
          <p class="text-sm text-slate-700">${escapeHtml(t.note)}</p>
          <p class="text-xs text-slate-400 mt-1">${escapeHtml(t.timestamp)}</p>
        </div>`).join('')
      : `<p class="text-sm text-slate-400">No touchpoints logged yet.</p>`;

    document.getElementById('modalRoot').innerHTML = `
    <div class="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4" onclick="if(event.target===this) closeModal()">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <div>
            <h2 class="text-lg font-semibold text-slate-900">${escapeHtml(a.companyName)}</h2>
            <p class="text-xs text-slate-400">Next Renewal: ${a.nextRenewalDate}</p>
          </div>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
        </div>
        <div class="px-6 py-5">
          <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-slate-50 rounded-lg p-4">
              <p class="text-xs font-medium text-slate-500 uppercase mb-2">Market Tier</p>
              ${tierBadge(a.marketTier)}
            </div>
            <div class="bg-slate-50 rounded-lg p-4">
              <p class="text-xs font-medium text-slate-500 uppercase mb-2">Usage Status</p>
              <span class="px-2 py-1 rounded-full text-xs font-semibold ${a.usageDrop ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}">${a.usageDrop ? 'Usage Drop' : 'Stable'}</span>
            </div>
            <div class="bg-slate-50 rounded-lg p-4">
              <p class="text-xs font-medium text-slate-500 uppercase mb-2">Unresolved Tickets</p>
              <div class="flex items-center gap-2">
                <button onclick="changeTicketCount('${a.id}', -1)" class="w-7 h-7 rounded-full bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 font-bold">&minus;</button>
                <span class="font-semibold text-slate-900 w-6 text-center">${a.unresolvedTickets}</span>
                <button onclick="changeTicketCount('${a.id}', 1)" class="w-7 h-7 rounded-full bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 font-bold">+</button>
              </div>
            </div>
          </div>
          ${warn ? `<div class="mb-6 text-sm font-semibold text-red-700 bg-red-100 rounded-lg px-3 py-2">&#9888; This account is flagged for attention (usage drop and/or high ticket volume).</div>` : ''}
          <div class="mb-6">
            <h3 class="font-semibold text-slate-900 mb-2">Account Strategy</h3>
            <textarea id="strategyInput" rows="2" placeholder="e.g. Push Dynamic Rate Card adoption ahead of Q1 renewal conversation" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm resize-none">${escapeHtml(a.accountStrategy || '')}</textarea>
            <div class="flex justify-end mt-2">
              <button onclick="saveAccountStrategy('${a.id}')" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg">Save Strategy</button>
            </div>
          </div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-slate-900">Touchpoint Log</h3>
            <span class="text-xs text-slate-400">${a.healthScore} health &middot; ${formatCurrency(a.arr)} ARR</span>
          </div>
          <div class="flex gap-2 mb-5">
            <input id="touchpointInput" type="text" placeholder="e.g. Discussed usage drop in sync" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" onkeydown="if(event.key==='Enter'){event.preventDefault();logTouchpoint('${a.id}')}">
            <button onclick="logTouchpoint('${a.id}')" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg whitespace-nowrap">Log Touchpoint</button>
          </div>
          <div class="max-h-64 overflow-y-auto scrollbar-thin pr-2">
            ${touchpointsHtml}
          </div>
        </div>
      </div>
    </div>`;
  }

  function changeTicketCount(id, delta) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    a.unresolvedTickets = Math.max(0, Number(a.unresolvedTickets) + delta);
    saveAccounts();
    renderAll();
  }

  function logTouchpoint(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    const input = document.getElementById('touchpointInput');
    const note = input.value.trim();
    if (!note) return;
    if (!a.touchpoints) a.touchpoints = [];
    a.touchpoints.push({
      note,
      timestamp: new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })
    });
    saveAccounts();
    renderProfileModalContent(id);
  }

  function saveAccountStrategy(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    const input = document.getElementById('strategyInput');
    a.accountStrategy = input.value.trim();
    saveAccounts();
    renderMarketSummary();
  }

  function closeModal() {
    document.getElementById('modalRoot').innerHTML = '';
    editingAccountId = null;
    profileAccountId = null;
    marketsModalAccountId = null;
  }

  // Wipes any locally-saved edits and reloads the sample data baked into this file's
  // seedAccounts(). Use this after the app itself has been updated with new sample data,
  // since a browser's existing localStorage otherwise takes precedence over code changes.
  function resetToSeedData() {
    if (!confirm('This will erase all local edits (touchpoints, strategies, market notes, added/edited accounts) and reload this file\'s built-in sample data. Continue?')) return;
    accounts = seedAccounts();
    saveAccounts();
    closeModal();
    renderAll();
  }

  // ---------- Init ----------
  accounts = loadAccounts();
  weeklyNotes = loadWeeklyNotes();
  renderAll();
  showView('dashboard');
  updateFilterButtons();
  document.getElementById('searchInput').addEventListener('input', handleSearch);
</script>
</body>
</html>
