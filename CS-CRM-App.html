<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Command — Customer Success CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .scrollbar-thin::-webkit-scrollbar { height: 6px; width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

<body class="bg-slate-100 text-slate-800">

<div class="flex h-screen overflow-hidden">

    <div class="h-16 flex items-center px-6 border-b border-slate-200 gap-2">

    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <button data-view="dashboard" onclick="showView('dashboard')" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        Dashboard
      </button>
      <button data-view="accounts" onclick="showView('accounts')" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/></svg>

      </button>
      <button data-view="kanban" onclick="showView('kanban')" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/></svg>

        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>

      </button>
      <button data-view="glance" onclick="showView('glance')" class="nav-link w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition">

      <button onclick="resetToSeedData()" class="text-xs font-medium text-indigo-600 hover:underline block">&#8635; Reset to latest sample data</button>

    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10">
      <h1 id="pageTitle" class="text-xl font-semibold text-slate-900">Dashboard</h1>

    <div class="p-8">

      <!-- DASHBOARD VIEW -->
      <section id="view-dashboard" class="view-section">

      </section>

      <!-- ACCOUNTS VIEW -->
      <section id="view-accounts" class="view-section hidden">

          <div class="relative w-full md:w-96">

          </div>
          <div class="flex items-center gap-2">
            <button onclick="exportCSV()" class="px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50">Export to CSV</button>
            <button onclick="openAddEditModal()" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">+ Add Account</button>
          </div>
        </div>

        <div class="flex items-center gap-2 mb-5">
          <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200" data-tier="All" onclick="setFilter('All')">All</button>
          <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200" data-tier="Enterprise" onclick="setFilter('Enterprise')">Enterprise</button>
          <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200" data-tier="Mid-Market" onclick="setFilter('Mid-Market')">Mid-Market</button>
          <button class="filter-btn px-3 py-1.5 rounded-full text-xs font-semibold border border-slate-200" data-tier="SMB" onclick="setFilter('SMB')">SMB</button>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-x-auto">
          <table class="w-full text-sm min-w-[900px]">
            <thead>
              <tr class="text-left text-xs text-slate-500 uppercase tracking-wide border-b border-slate-200">
                <th class="py-3 px-4">Company Name</th>
                <th class="py-3 px-4">Market Tier</th>
                <th class="py-3 px-4">ARR</th>

                <th class="py-3 px-4 text-right">Actions</th>

  function buildMarkets(companyName) {
    const callData = MARKET_CALL_DATA[companyName] || {};
    const ticketData = MARKET_TICKETS_DATA[companyName] || {};
    return (MARKET_USAGE_DATA[companyName] || []).map(m => ({
      name: m.name,
      daysActive: m.daysActive,
      dataLoads: m.dataLoads,
      mostUsedModule: '',
      leastUsedModule: '',
      aeUsage: '',
      pCodeQuarters: '',
      recentEmail: '',
      recentCall: callData[m.name] || '',
      relatedTickets: ticketData[m.name] || '',
      marketTickets: ''
    }));
  }

  let accounts = [];
  let currentFilter = 'All';
  let searchQuery = '';
  let editingAccountId = null;
  let profileAccountId = null;
  let marketsModalAccountId = null;
  let marketsSearchQuery = '';

  // ---------- Persistence ----------
  function uuid() {
    return 'acc_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }

  // ARR and Next Renewal Date come from "Media Customer CS List 2025-09-30" (Summary tab).
  // That file is ~1 year old as of today, so several contract end dates in it have already
  // passed - treat renewal dates as directional and confirm before using them for real renewal
  // planning. Nexstar and Paramount are not in that list at all (likely too new / not yet signed)
  // so their ARR/renewal stay as explicit placeholders. Lifecycle stage and health score are
  // directional manual assessments. Unresolved ticket counts and usage-drop flags now come from
  // ACCOUNT_SYNC_META above (real Jira RO counts, refreshed 2026-10-13) instead of being hardcoded
  // here. Account Strategy text is built from the same CS List's real "Growth Area" / "Persona" columns.
  function seedAccounts() {
    const meta = (name) => ACCOUNT_SYNC_META[name] || { unresolvedTickets: 0, usageDrop: false };
    return [
      { id: uuid(), companyName: 'AMC Networks (AMCN)', marketTier: 'Enterprise', arr: 205000, lifecycleStage: 'Steady State', healthScore: 'Yellow', ...meta('AMC Networks (AMCN)'), nextRenewalDate: '2025-11-13', accountStrategy: 'Growth opportunity: AIDA (+$150,020 potential ARR).', touchpoints: [], markets: buildMarkets('AMC Networks (AMCN)') },
      { id: uuid(), companyName: 'Nexstar Media Group', marketTier: 'Enterprise', arr: 0, lifecycleStage: 'Training/Adoption', healthScore: 'Green', ...meta('Nexstar Media Group'), nextRenewalDate: 'TBD', accountStrategy: '', touchpoints: [], markets: buildMarkets('Nexstar Media Group') },
      { id: uuid(), companyName: 'Sinclair Broadcast Group', marketTier: 'Enterprise', arr: 679953, lifecycleStage: 'Steady State', healthScore: 'Green', ...meta('Sinclair Broadcast Group'), nextRenewalDate: '2026-02-26', accountStrategy: 'Growth opportunity: AIDA (+$241,899 potential ARR). Persona: moving to centralization.', touchpoints: [], markets: buildMarkets('Sinclair Broadcast Group') },
      { id: uuid(), companyName: 'Hearst Television', marketTier: 'Enterprise', arr: 384000, lifecycleStage: 'Steady State', healthScore: 'Green', ...meta('Hearst Television'), nextRenewalDate: '2025-12-31', accountStrategy: 'Growth opportunity: AIDA (+$76,000 potential ARR). Persona: corporate wants standardization across markets.', touchpoints: [], markets: buildMarkets('Hearst Television') },
      { id: uuid(), companyName: 'Entravision Communications', marketTier: 'Mid-Market', arr: 199100, lifecycleStage: 'Steady State', healthScore: 'Green', ...meta('Entravision Communications'), nextRenewalDate: '2026-07-15', accountStrategy: 'Growth opportunity: ProPRO (+$600,900 potential ARR). Persona: markets own all decisions.', touchpoints: [], markets: buildMarkets('Entravision Communications') },
      { id: uuid(), companyName: 'Gray Television', marketTier: 'Enterprise', arr: 6720, lifecycleStage: 'Steady State', healthScore: 'Green', ...meta('Gray Television'), nextRenewalDate: '2027-12-31', accountStrategy: 'Growth opportunity: remaining stations + AIDA (+$793,280 potential ARR) - only ~3 of many stations contracted today. Persona: markets own all decisions.', touchpoints: [], markets: buildMarkets('Gray Television') },
      { id: uuid(), companyName: 'Paramount Global', marketTier: 'Enterprise', arr: 0, lifecycleStage: 'Implementation/Onboarding', healthScore: 'Yellow', ...meta('Paramount Global'), nextRenewalDate: 'TBD', accountStrategy: '', touchpoints: [], markets: buildMarkets('Paramount Global') },
      { id: uuid(), companyName: 'Renda Broadcasting', marketTier: 'SMB', arr: 8945, lifecycleStage: 'Steady State', healthScore: 'Red', ...meta('Renda Broadcasting'), nextRenewalDate: '2026-03-31', accountStrategy: 'Growth opportunity: remaining stations (+$22,555 potential ARR). Persona: corporate wants standardization across markets.', touchpoints: [], markets: buildMarkets('Renda Broadcasting') },
      { id: uuid(), companyName: 'Capitol Broadcasting Company', marketTier: 'Mid-Market', arr: 15600, lifecycleStage: 'Steady State', healthScore: 'Red', ...meta('Capitol Broadcasting Company'), nextRenewalDate: '2026-12-31', accountStrategy: 'Growth opportunity: remaining radio stations + AIDA (+$14,100 potential ARR). Persona: markets own all decisions.', touchpoints: [], markets: buildMarkets('Capitol Broadcasting Company') }

  function loadAccounts() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      console.error('Failed to load accounts from localStorage', e);
    }
    const seeded = seedAccounts();
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
    } catch (e) {
      console.error('Failed to write seed accounts to localStorage', e);
    }
    return seeded;
  }

  function saveAccounts() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
    } catch (e) {
      console.error('Failed to save accounts to localStorage', e);
    }
  }

  // Per-viewer "Today's Agenda" / "Action Items" notes for This Week at a Glance meetings, keyed by
  // meeting id. Lives only in this browser's localStorage - the sync never reads or writes this object,
  // exactly like touchpoints and account strategy.
  const WEEKLY_NOTES_KEY = 'csCrmWeeklyNotes';
  let weeklyNotes = {};

  function loadWeeklyNotes() {
    try {
      const raw = localStorage.getItem(WEEKLY_NOTES_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {
      console.error('Failed to load weekly notes from localStorage', e);
    }
    return {};
  }

  function saveWeeklyNotes() {
    try {
      localStorage.setItem(WEEKLY_NOTES_KEY, JSON.stringify(weeklyNotes));
    } catch (e) {
      console.error('Failed to save weekly notes to localStorage', e);
    }
  }

  function updateWeeklyNote(meetingId, field, value) {
    if (!weeklyNotes[meetingId]) weeklyNotes[meetingId] = { agenda: '', actionItems: '' };
    weeklyNotes[meetingId][field] = value;
    saveWeeklyNotes();
  }

  // ---------- Sync latest data ----------
  // Merges the four sync-managed structures (MARKET_USAGE_DATA, MARKET_CALL_DATA, ACCOUNT_SYNC_META,
  // MARKET_TICKETS_DATA) into the accounts already saved in this browser's localStorage. Never touches
  // touchpoints, accountStrategy, or the manually-typed per-market fields (mostUsedModule,
  // leastUsedModule, aeUsage, pCodeQuarters, recentEmail, marketTickets) - those are this user's own
  // notes. WEEKLY_MEETINGS_DATA/WEEKLY_GLANCE_MONDAY are NOT part of this merge - they render directly
  // from the constants above on every page load instead (see renderGlance()).
  function syncLatestData() {
    if (!confirm('Pull the latest synced usage data, call notes, ticket counts, and ticket-market mapping into your accounts?\n\nThis will NOT touch your touchpoints, account strategy, or manually-typed market notes.')) return;
    accounts.forEach(a => {
      const meta = ACCOUNT_SYNC_META[a.companyName];
      if (meta) {
        a.unresolvedTickets = meta.unresolvedTickets;
        a.usageDrop = meta.usageDrop;
      }
      const usage = MARKET_USAGE_DATA[a.companyName] || [];
      const callData = MARKET_CALL_DATA[a.companyName] || {};
      const ticketData = MARKET_TICKETS_DATA[a.companyName] || {};
      if (!a.markets) a.markets = [];
      usage.forEach(u => {
        let m = a.markets.find(x => x.name === u.name);
        if (!m) {
          m = { name: u.name, daysActive: 0, dataLoads: 0, mostUsedModule: '', leastUsedModule: '', aeUsage: '', pCodeQuarters: '', recentEmail: '', recentCall: '', relatedTickets: '', marketTickets: '' };
          a.markets.push(m);
        }
        m.daysActive = u.daysActive;
        m.dataLoads = u.dataLoads;
        if (m.marketTickets === undefined) m.marketTickets = '';
        if (callData[u.name] !== undefined) m.recentCall = callData[u.name];
        if (ticketData[u.name] !== undefined) m.relatedTickets = ticketData[u.name];
      });
    });
    saveAccounts();
    renderAll();
    alert('Synced latest usage data, call notes, ticket counts, and ticket-market mapping into your accounts.');
  }

  function renderLastSyncedLabel() {
    const el = document.getElementById('lastSyncedLabel');
    if (el) el.textContent = EXTERNAL_DATA.lastSyncedAt ? `Last synced: ${EXTERNAL_DATA.lastSyncedAt}` : '';
  }

  // ---------- Helpers ----------
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function formatCurrency(n) {
    return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(Number(n) || 0);
  }

  function tierBadge(tier) {
    const map = { 'Enterprise': 'bg-indigo-100 text-indigo-700', 'Mid-Market': 'bg-blue-100 text-blue-700', 'SMB': 'bg-slate-200 text-slate-700' };
    return `<span class="px-2 py-1 rounded-full text-xs font-semibold ${map[tier] || 'bg-slate-100 text-slate-600'}">${escapeHtml(tier)}</span>`;
  }

  function healthBadge(h) {
    const map = { 'Green': 'bg-green-100 text-green-700', 'Yellow': 'bg-yellow-100 text-yellow-700', 'Red': 'bg-red-100 text-red-700' };
    return `<span class="px-2 py-1 rounded-full text-xs font-semibold ${map[h] || 'bg-slate-100 text-slate-600'}">${escapeHtml(h)}</span>`;
  }

  // ---------- View switching ----------
  function showView(view) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
    document.getElementById('view-' + view).classList.remove('hidden');
    document.querySelectorAll('.nav-link').forEach(el => {
      if (el.dataset.view === view) {
        el.classList.add('bg-indigo-50', 'text-indigo-700');
        el.classList.remove('text-slate-600');
      } else {
        el.classList.remove('bg-indigo-50', 'text-indigo-700');
        el.classList.add('text-slate-600');
      }
    });
    const titles = { dashboard: 'Dashboard', accounts: 'Accounts Directory', kanban: 'Lifecycle Board', market: 'Market Summary', glance: 'This Week at a Glance' };
    document.getElementById('pageTitle').textContent = titles[view];
  }

  function renderAll() {
    renderDashboard();
    renderAccountsTable();
    renderKanban();
    renderMarketSummary();
    renderGlance();
    renderLastSyncedLabel();
    if (profileAccountId) renderProfileModalContent(profileAccountId);

  // ---------- Dashboard ----------
  function computeMetrics() {
    const totalAccounts = accounts.length;
    const arrAtRisk = accounts.filter(a => a.usageDrop || a.healthScore === 'Red').reduce((s, a) => s + Number(a.arr), 0);
    const totalTickets = accounts.reduce((s, a) => s + Number(a.unresolvedTickets), 0);
    const greenCount = accounts.filter(a => a.healthScore === 'Green').length;
    const healthPct = totalAccounts ? Math.round((greenCount / totalAccounts) * 100) : 0;
    return { totalAccounts, arrAtRisk, totalTickets, healthPct };
  }

  function healthLabel(pct) {
    if (pct >= 70) return { label: 'Healthy', color: 'text-green-600' };
    if (pct >= 40) return { label: 'At Risk', color: 'text-yellow-600' };
    return { label: 'Critical', color: 'text-red-600' };
  }

  function metricCard(label, value, colorClass) {
    return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
      <p class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2">${label}</p>
      <p class="text-2xl font-bold ${colorClass}">${value}</p>
    </div>`;
  }

  function renderDashboard() {
    const m = computeMetrics();
    const hl = healthLabel(m.healthPct);

    const tierRows = TIERS.map(t => {
      const list = accounts.filter(a => a.marketTier === t);
      const arr = list.reduce((s, a) => s + Number(a.arr), 0);
      const tickets = list.reduce((s, a) => s + Number(a.unresolvedTickets), 0);
      return `<tr class="border-b border-slate-100 last:border-0">
        <td class="py-3 px-4 font-medium text-slate-800">${t}</td>
        <td class="py-3 px-4 text-slate-600">${list.length}</td>
        <td class="py-3 px-4 text-slate-600">${formatCurrency(arr)}</td>
        <td class="py-3 px-4 text-slate-600">${tickets}</td>
      </tr>`;
    }).join('');

    const dropAccounts = accounts.filter(a => a.usageDrop);
    const alertRows = dropAccounts.length ? dropAccounts.map(a => `
      <div class="flex items-center justify-between py-3 px-4 border-b border-slate-100 last:border-0">
        <div>
          <button onclick="openProfileModal('${a.id}')" class="font-medium text-indigo-600 hover:underline">${escapeHtml(a.companyName)}</button>
          <span class="ml-2 text-xs text-slate-500">${escapeHtml(a.marketTier)} &middot; ${formatCurrency(a.arr)} ARR</span>
        </div>
        <span class="inline-flex items-center gap-1 text-xs font-semibold text-red-700 bg-red-100 px-2 py-1 rounded-full">&#9888; Usage Drop</span>
      </div>`).join('') : `<div class="py-6 px-4 text-sm text-slate-400 text-center">No usage-drop alerts. All clear.</div>`;

    document.getElementById('dashboardContent').innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        ${metricCard('Total Managed Accounts', m.totalAccounts, 'text-slate-900')}
        ${metricCard('ARR At Risk', formatCurrency(m.arrAtRisk), 'text-red-600')}
        ${metricCard('Total Unresolved Tickets', m.totalTickets, 'text-amber-600')}
        ${metricCard('Overall Portfolio Health', hl.label + ' (' + m.healthPct + '%)', hl.color)}
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
          <div class="px-5 py-4 border-b border-slate-100"><h2 class="font-semibold text-slate-900">Market Tier Breakdown</h2></div>
          <table class="w-full text-sm">
            <thead><tr class="text-left text-xs text-slate-500 uppercase tracking-wide">
              <th class="py-2 px-4">Tier</th><th class="py-2 px-4">Accounts</th><th class="py-2 px-4">ARR</th><th class="py-2 px-4">Tickets</th>
            </tr></thead>
            <tbody>${tierRows}</tbody>
          </table>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
          <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
            <h2 class="font-semibold text-slate-900">Usage Drop Alerts</h2>
            <span class="text-xs font-medium text-slate-400">${dropAccounts.length} flagged</span>
          </div>
          <div>${alertRows}</div>
        </div>
      </div>
    `;
  }

  // ---------- Accounts Directory ----------
  function getFilteredAccounts() {
    return accounts.filter(a => {
      const matchesTier = currentFilter === 'All' || a.marketTier === currentFilter;
      const q = searchQuery.trim().toLowerCase();
      const matchesSearch = !q || a.companyName.toLowerCase().includes(q) || a.marketTier.toLowerCase().includes(q);
      return matchesTier && matchesSearch;
    });
  }

  function renderAccountsTable() {
    const list = getFilteredAccounts();
    const tbody = document.getElementById('accountsTableBody');
    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="9" class="py-8 text-center text-slate-400">No accounts match your search/filter.</td></tr>`;
      return;
    }
    tbody.innerHTML = list.map(a => `
      <tr class="border-b border-slate-100 hover:bg-slate-50">
        <td class="py-3 px-4"><button onclick="openProfileModal('${a.id}')" class="font-medium text-indigo-600 hover:underline">${escapeHtml(a.companyName)}</button></td>
        <td class="py-3 px-4">${tierBadge(a.marketTier)}</td>
        <td class="py-3 px-4 text-slate-700">${formatCurrency(a.arr)}</td>
        <td class="py-3 px-4 text-slate-700">${escapeHtml(a.lifecycleStage)}</td>

          <button onclick="openAddEditModal('${a.id}')" class="text-slate-500 hover:text-indigo-600 text-sm font-medium mr-3">Edit</button>
          <button onclick="deleteAccount('${a.id}')" class="text-slate-500 hover:text-red-600 text-sm font-medium">Delete</button>
        </td>
      </tr>
    `).join('');

  function setFilter(tier) {
    currentFilter = tier;
    renderAccountsTable();
    updateFilterButtons();
  }

  function updateFilterButtons() {
    document.querySelectorAll('.filter-btn').forEach(btn => {
      const active = btn.dataset.tier === currentFilter;
      btn.classList.toggle('bg-indigo-600', active);
      btn.classList.toggle('text-white', active);
      btn.classList.toggle('border-indigo-600', active);
      btn.classList.toggle('bg-white', !active);
      btn.classList.toggle('text-slate-600', !active);
    });
  }

    searchQuery = e.target.value;
    renderAccountsTable();

  function toggleUsageDrop(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    a.usageDrop = !a.usageDrop;
    saveAccounts();
    renderAll();
  }

  function deleteAccount(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    if (!confirm(`Delete ${a.companyName}? This cannot be undone.`)) return;
    accounts = accounts.filter(x => x.id !== id);
    saveAccounts();
    if (profileAccountId === id) closeModal();
    renderAll();
  }

  function csvEscape(val) {
    const s = String(val === undefined || val === null ? '' : val);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function exportCSV() {
    const headers = ['Company Name', 'Market Tier', 'ARR', 'Lifecycle Stage', 'Health Score', 'Unresolved Tickets', 'Usage Drop', 'Next Renewal Date'];
    const rows = accounts.map(a => [a.companyName, a.marketTier, a.arr, a.lifecycleStage, a.healthScore, a.unresolvedTickets, a.usageDrop ? 'Yes' : 'No', a.nextRenewalDate]);
    const csvContent = [headers, ...rows].map(row => row.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', `cs-accounts-${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

    }).join('')}</div>`;

  function kanbanCard(a) {
    const flagUsage = a.usageDrop;
    const flagTickets = Number(a.unresolvedTickets) > 3;
    let warningText = '';
    if (flagUsage && flagTickets) warningText = 'Usage Drop &middot; ' + a.unresolvedTickets + ' Open Tickets';
    else if (flagUsage) warningText = 'Usage Drop';
    else if (flagTickets) warningText = a.unresolvedTickets + ' Open Tickets';

    return `<div class="bg-white rounded-lg border border-slate-200 shadow-sm p-3">
      <div class="flex items-start justify-between mb-1 gap-2">
        <button onclick="openProfileModal('${a.id}')" class="font-medium text-sm text-indigo-600 hover:underline text-left">${escapeHtml(a.companyName)}</button>

      <div class="text-xs text-slate-500 mb-2 flex items-center gap-1 flex-wrap">${tierBadge(a.marketTier)} <span>${formatCurrency(a.arr)} ARR</span></div>
      ${warningText ? `<div class="text-xs font-semibold text-red-700 bg-red-100 rounded px-2 py-1 mb-2 inline-block">&#9888; ${warningText}</div>` : ''}
      <select onchange="changeStage('${a.id}', this.value)" class="w-full text-xs border border-slate-200 rounded px-2 py-1 bg-slate-50">
        ${STAGES.map(s => `<option value="${s}" ${s === a.lifecycleStage ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
    </div>`;
  }

  function changeStage(id, stage) {
    const a = accounts.find(x => x.id === id);

    a.lifecycleStage = stage;
    saveAccounts();
    renderAll();

      const yellowCount = list.filter(a => a.healthScore === 'Yellow').length;
      const redCount = list.filter(a => a.healthScore === 'Red').length;
      const dropCount = list.filter(a => a.usageDrop).length;

      const rows = list.length ? list.map(a => marketAccountRow(a)).join('')
        : `<p class="text-sm text-slate-400 px-5 py-6 text-center">No accounts in this tier.</p>`;

      return `<div class="bg-white rounded-xl border border-slate-200 shadow-sm mb-6">
        <div class="px-5 py-4 border-b border-slate-100 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="font-semibold text-slate-900">${tier}</h2>
            <p class="text-xs text-slate-400">${list.length} account${list.length === 1 ? '' : 's'} &middot; ${formatCurrency(arr)} ARR &middot; ${tickets} unresolved ticket${tickets === 1 ? '' : 's'}</p>

  function submitAccountForm(event) {
    event.preventDefault();
    const form = event.target;
    document.querySelectorAll('.field-error').forEach(el => el.textContent = '');

    const raw = {
      companyName: form.companyName.value.trim(),
      marketTier: form.marketTier.value,
      arr: form.arr.value,
      lifecycleStage: form.lifecycleStage.value,
      healthScore: form.healthScore.value,
      unresolvedTickets: form.unresolvedTickets.value,
      nextRenewalDate: form.nextRenewalDate.value,
      usageDrop: form.usageDrop.checked
    };

    let valid = true;
    function setError(field, msg) {
      valid = false;
      const el = form.querySelector(`.field-error[data-field="${field}"]`);
      if (el) el.textContent = msg;
    }

    if (!raw.companyName) setError('companyName', 'Company name is required.');
    if (!TIERS.includes(raw.marketTier)) setError('marketTier', 'Select a market tier.');
    if (raw.arr === '' || isNaN(Number(raw.arr)) || Number(raw.arr) < 0) setError('arr', 'Enter a valid non-negative ARR.');
    if (!STAGES.includes(raw.lifecycleStage)) setError('lifecycleStage', 'Select a lifecycle stage.');
    if (!HEALTH_SCORES.includes(raw.healthScore)) setError('healthScore', 'Select a health score.');
    if (raw.unresolvedTickets === '' || isNaN(Number(raw.unresolvedTickets)) || Number(raw.unresolvedTickets) < 0 || !Number.isInteger(Number(raw.unresolvedTickets))) setError('unresolvedTickets', 'Enter a valid non-negative whole number.');
    if (!raw.nextRenewalDate) setError('nextRenewalDate', 'Select a renewal date.');

    if (!valid) return;

    if (editingAccountId) {
      const a = accounts.find(x => x.id === editingAccountId);
      Object.assign(a, {
        companyName: raw.companyName,
        marketTier: raw.marketTier,
        arr: Number(raw.arr),
        lifecycleStage: raw.lifecycleStage,
        healthScore: raw.healthScore,
        unresolvedTickets: Number(raw.unresolvedTickets),
        nextRenewalDate: raw.nextRenewalDate,
        usageDrop: raw.usageDrop
      });
    } else {
      accounts.push({
        id: uuid(),
        companyName: raw.companyName,
        marketTier: raw.marketTier,
        arr: Number(raw.arr),
        lifecycleStage: raw.lifecycleStage,
        healthScore: raw.healthScore,
        unresolvedTickets: Number(raw.unresolvedTickets),
        nextRenewalDate: raw.nextRenewalDate,
        usageDrop: raw.usageDrop,
        accountStrategy: '',
        touchpoints: [],
        markets: []
      });
    }

    saveAccounts();
    closeModal();
    renderAll();
  }

            </div>
          </div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-slate-900">Touchpoint Log</h3>
            <span class="text-xs text-slate-400">${a.healthScore} health &middot; ${formatCurrency(a.arr)} ARR</span>
          </div>
          <div class="flex gap-2 mb-5">
            <input id="touchpointInput" type="text" placeholder="e.g. Discussed usage drop in sync" class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm" onkeydown="if(event.key==='Enter'){event.preventDefault();logTouchpoint('${a.id}')}">
            <button onclick="logTouchpoint('${a.id}')" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg whitespace-nowrap">Log Touchpoint</button>
          </div>
          <div class="max-h-64 overflow-y-auto scrollbar-thin pr-2">
            ${touchpointsHtml}
          </div>
        </div>
      </div>
    </div>`;
  }

  function changeTicketCount(id, delta) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    a.unresolvedTickets = Math.max(0, Number(a.unresolvedTickets) + delta);
    saveAccounts();
    renderAll();
  }

  function logTouchpoint(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    const input = document.getElementById('touchpointInput');
    const note = input.value.trim();
    if (!note) return;
    if (!a.touchpoints) a.touchpoints = [];
    a.touchpoints.push({
      note,
      timestamp: new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' })
    });
    saveAccounts();
    renderProfileModalContent(id);
  }

  function saveAccountStrategy(id) {
    const a = accounts.find(x => x.id === id);
    if (!a) return;
    const input = document.getElementById('strategyInput');
    a.accountStrategy = input.value.trim();
    saveAccounts();
    renderMarketSummary();
  }

  function closeModal() {
    document.getElementById('modalRoot').innerHTML = '';
    editingAccountId = null;
    profileAccountId = null;
    marketsModalAccountId = null;
  }

  // Wipes any locally-saved edits and reloads the sample data baked into this file's
  // seedAccounts(). Use this after the app itself has been updated with new sample data,
  // since a browser's existing localStorage otherwise takes precedence over code changes.
  function resetToSeedData() {
    if (!confirm('This will erase all local edits (touchpoints, strategies, market notes, added/edited accounts) and reload this file\'s built-in sample data. Continue?')) return;
    accounts = seedAccounts();
    saveAccounts();
    closeModal();
    renderAll();
  }

  // ---------- Init ----------
  accounts = loadAccounts();
  weeklyNotes = loadWeeklyNotes();
  renderAll();
  showView('dashboard');
  updateFilterButtons();
  document.getElementById('searchInput').addEventListener('input', handleSearch);
</script>
</body>
</html>
